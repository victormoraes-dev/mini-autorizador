spring:
  application:
    name: mini-authorizer
  profiles:
    default: avaliacao
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    password:
      iterations: 210000
      salt-length: 16
      key-length: 256
    api:
      requests-per-window: ${APP_SECURITY_RATE_LIMIT_REQUESTS:120}
      window-seconds: ${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}
