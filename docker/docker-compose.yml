  #     MONGO_INITDB_ROOT_PASSWORD: password
  #   volumes:
  #     - ./scripts/init.js:/docker-entrypoint-initdb.d/init.js:ro

  mysql:
    image: mysql:5.7
    hostname: mysql
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: miniautorizador
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  application:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mini-authorizer
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: avaliacao
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SERVER_ADDRESS: 0.0.0.0
      APP_SECURITY_READER_API_KEY: ${APP_SECURITY_READER_API_KEY:-reader-local-key-with-at-least-32-chars}
      APP_SECURITY_WRITER_API_KEY: ${APP_SECURITY_WRITER_API_KEY:-writer-local-key-with-at-least-32-chars}
